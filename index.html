<!doctype html>
<html lang="en">
  <head>
    <script>
      // Boot guard: this app routes any unknown top-level path as a room to
      // join ("/:spaceIdOrAlias"), so landing on /index.html made it try to
      // join a room literally called "index.html". Home Screen icons created
      // by the previous client launch exactly that URL. An edge redirect
      // cannot save us here — the service worker serves the cached app
      // without ever hitting the network — so normalise the path in the
      // document itself, before the router reads it.
      (function () {
        var loc = window.location;

        // 1. Stale launch URL. This app routes any unknown top-level path as a
        //    room to join ("/:spaceIdOrAlias"), so /index.html made it try to
        //    join a room named "index.html". Home Screen icons from the
        //    previous client launch exactly that URL. An edge redirect cannot
        //    help — the service worker answers from cache without touching the
        //    network — so normalise here, before the router reads the path.
        var path = loc.pathname;
        if (/\/index\.html$/.test(path)) {
          path = path.replace(/index\.html$/, '');
          window.history.replaceState(null, '', path + loc.search + loc.hash);
        }

        // 2. Shared permalinks. Copy-link and share build "<origin>/#/<target>"
        //    (the Matrix permalink shape, so other clients still understand
        //    them), but this app is path-routed and would otherwise ignore the
        //    fragment and dump the visitor on the home screen. Translate the
        //    fragment into a real route.
        var m = /^#\/([^?]+)(\?.*)?$/.exec(loc.hash || '');
        if (m) {
          var target = decodeURIComponent(m[1]);
          var query = m[2] || '';
          var dest = null;

          if (target.charAt(0) === '@') {
            // A person: open (or start) the direct chat with them.
            dest = '/direct/create?userId=' + encodeURIComponent(target);
          } else if (target.charAt(0) === '#' || target.charAt(0) === '!') {
            // A room, channel or group, by alias or id.
            dest = '/home/' + encodeURIComponent(target) + '/' + query;
          }

          if (dest) {
            window.history.replaceState(null, '', dest);
            return;
          }
        }

        // 3. BlockWire short links — what copy/share produce today:
        //
        //      /degens          a room, group or channel by name
        //      /degens/$abc     one message inside it
        //      /@stephen        a person
        //      /+7Fk2xQwe       an invite link (handled by a route, not here)
        //      /room/!id%3A…    a room with no name, the long-form fallback
        //
        //    SERVER is hardcoded because this script runs before config.json
        //    is fetched, and a share link that resolves late is a share link
        //    that dumps the visitor on the home screen. It matches the
        //    homeserver in config.json.
        var SERVER = 'blockwire.chat';

        // Paths the app itself owns. A room may legitimately be called
        // "settings"; it still cannot have /settings. Keep in sync with the
        // same list in src/app/plugins/blockwire-link.ts.
        var RESERVED = {
          login: 1,
          register: 1,
          'reset-password': 1,
          home: 1,
          direct: 1,
          explore: 1,
          create: 1,
          'create-room': 1,
          'bug-report': 1,
          navigate: 1,
          profile: 1,
          inbox: 1,
          settings: 1,
          lp: 1,
          invite: 1,
          source: 1,
          privacy: 1,
          terms: 1,
          'index.html': 1,
          'config.json': 1,
          'sw.js': 1,
          assets: 1,
          public: 1,
          'manifest.json': 1,
          '.well-known': 1,
        };

        var parts = path.replace(/^\/+|\/+$/g, '').split('/');
        var head = parts[0] ? decodeURIComponent(parts[0]) : '';
        if (!head) return;

        // Long form: /room/<full id or alias>[/<event>]
        if (head === 'room' && parts[1]) {
          var full = decodeURIComponent(parts[1]);
          var tail = parts[2] ? '/' + parts[2] : '';
          window.history.replaceState(
            null,
            '',
            '/home/' + encodeURIComponent(full) + tail + '/' + loc.search
          );
          return;
        }

        if (RESERVED[head.toLowerCase()] === 1) return;

        // A person: /@stephen, or /@bob:elsewhere for a foreign account.
        if (head.charAt(0) === '@') {
          var userId = head.indexOf(':') === -1 ? head + ':' + SERVER : head;
          window.history.replaceState(
            null,
            '',
            '/direct/create?userId=' + encodeURIComponent(userId)
          );
          return;
        }

        // An invite link. The route does the work — it takes a request to
        // the gateway to learn where the link even leads — but the `+` is
        // rewritten away here so the router never has to parse a sigil.
        if (head.charAt(0) === '+') {
          window.history.replaceState(
            null,
            '',
            '/invite/' + encodeURIComponent(head.slice(1)) + loc.search
          );
          return;
        }

        // Anything else that still carries a sigil is an internal identifier
        // and not ours to rewrite: /!space:server is how this app addresses a
        // space, and reloading while inside one must keep working.
        if (/^[!#$]/.test(head)) return;

        // A bare name: /degens -> the room #degens:blockwire.chat.
        if (!/^[a-z0-9._=-]+$/i.test(head)) return;
        var eventTail = parts[1] && parts[1].charAt(0) === '$' ? '/' + parts[1] : '';
        window.history.replaceState(
          null,
          '',
          '/home/' + encodeURIComponent('#' + head + ':' + SERVER) + eventTail + '/' + loc.search
        );
      })();
    </script>

    <script>
      window.global ||= window;
    </script>
    <script>
      (function () {
        var base = '%BASE_URL%';
        var lng = (localStorage.getItem('i18nextLng') || navigator.language || 'en').split('-')[0];
        var configPromise = fetch(base + 'config.json').then(function (r) {
          if (!r.ok) return undefined;
          return r.json();
        });
        var localePromise = fetch(base + 'public/locales/' + lng + '.json');
        window.__SABLE_PRELOAD = {
          config: configPromise,
          locale: { lng: lng, promise: localePromise },
        };
        configPromise.catch(function () {});
        localePromise.catch(function () {});
      })();
    </script>
