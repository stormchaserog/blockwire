name: Update screenshot baselines

# Screenshot baselines must be rendered in the pinned Playwright container
# (font rendering differs between hosts — see tests/e2e/README.md), so they
# are regenerated here rather than on a developer machine. Dispatch this on a
# branch and it commits any changed baselines back to that branch.
on:
  workflow_dispatch:

permissions: {}

jobs:
  update-baselines:
    name: Regenerate Playwright baselines
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup

      - name: Regenerate baselines
        run: pnpm run test:e2e:docker:update
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Commit and push updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines already up to date"
          else
            git commit -m "chore: update Playwright screenshot baselines"
            git push
          fi

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-baselines
          path: |
            playwright-report
            test-results
          retention-days: 7
