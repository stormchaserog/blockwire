name: Create Release PR

on:
  push:
    branches: [dev]

permissions: {}

jobs:
  prepare-release:
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # The bot app is optional; without its secrets the release PR is opened
      # with the workflow's own token. (secrets is not allowed in step `if`s,
      # so the check lives in env.)
      HAS_BOT_APP: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Generate bot token
        id: generate-token
        if: ${{ env.HAS_BOT_APP == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.generate-token.outputs.token || github.token }}

      - name: Setup app
        uses: ./.github/actions/setup
        with:
          install-command: ''

      - uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35 # v2.0.2

      - name: Prepare Release
        run: mise run knope -- prepare-release --verbose
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || github.token }}

      - name: Add internal label
        run: |
          PR_NUMBER=$(gh pr list --head release --json number --jq '.[0].number')
          gh pr edit "$PR_NUMBER" --add-label internal
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || github.token }}
