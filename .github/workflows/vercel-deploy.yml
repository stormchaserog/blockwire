name: Deploy web to Vercel

# Ships every dev merge to blockwire.chat, replacing the manual DEPLOY.md
# ritual. Encodes its hard-won traps: deploys from dist/ with vercel.json and
# .well-known copied in, targets the real project by id (never a project named
# after the directory), and ALWAYS sets the domain alias - production deploys
# stopped auto-assigning it long ago.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_EpAVm4KoICSv6TT33BUOcRYQ
  VERCEL_PROJECT_ID: prj_DFB8UGSfVhDnmEeYvJzxzIOF5AOZ

jobs:
  # The secrets context is not allowed in a job-level `if`, so a preflight job
  # exposes the check as an output the deploy job can gate on.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - name: Check for Vercel token
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not set; skipping the production deploy."
          fi

  deploy:
    needs: preflight
    if: ${{ needs.preflight.outputs.has_token == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: production
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Stage deploy directory
        run: |
          cp vercel.json dist/
          cp -r public/.well-known dist/

      - name: Deploy to production
        id: deploy
        working-directory: dist
        run: |
          url="$(npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")"
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Point blockwire.chat at the deployment
        working-directory: dist
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: npx vercel@latest alias set "$DEPLOY_URL" blockwire.chat --token "$VERCEL_TOKEN"
