# Docs: <https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/customizing-dependency-updates>

version: 2

# Every group below is deliberately restricted to `update-types: [minor, patch]`.
# Majors are left ungrouped so each one opens as its own pull request with its
# own changelog. Without that, a grouped update arrives wearing a `chore:`
# prefix and hides real migration work - a single "bump the npm group" PR once
# carried React 18 -> 19, react-router-dom 6 -> 7, i18next 25 -> 26 and
# react-leaflet 4 -> 5 together, and was closed unmerged.
updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - internal
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns:
          - '*'
        update-types: [minor, patch]

  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - internal
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns:
          - '*'
        update-types: [minor, patch]

  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - internal
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns:
          - '*'
        update-types: [minor, patch]

  - package-ecosystem: cargo
    cooldown:
      default-days: 7
    directory: /src-tauri
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - internal
    commit-message:
      prefix: chore
    groups:
      cargo:
        patterns:
          - '*'
        update-types: [minor, patch]
